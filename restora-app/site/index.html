<title>RESTORA Cocina</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">

<style>
:root {
  --canvas:#f4f1e9; --surface:#fffefb; --raised:#ffffff; --sunk:#ede8dc;
  --ink:#17211b; --muted:#655f53; --faint:#938d7e; --line:#e2d9c9; --hair:#ece6d9;
  --brand:#1e3d2f; --accent:#3e8e6a; --accent-soft:#e6efe8;
  --ok:#2e7d55; --ok-bg:#e5efe7; --warn:#9a6d28; --warn-bg:#f5ecd9; --crit:#b04f36; --crit-bg:#f8e6df;
  --rail:#14261d; --rail-deep:#0f1d16; --rail-ink:#eff3ed;
  --rail-muted:rgba(239,243,237,0.56); --rail-hover:rgba(255,255,255,0.07); --rail-active:rgba(255,255,255,0.12); --rail-line:rgba(239,243,237,0.13);
  --f-display:"Instrument Serif",Georgia,serif; --f-ui:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --rail-w:246px; --r-sm:6px; --r-md:10px; --r-lg:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --canvas:#0f1310; --surface:#171c15; --raised:#1b211a; --sunk:#121711;
  --ink:#eff1e8; --muted:#9ba193; --faint:#7a8073; --line:#2a302a; --hair:#212720;
  --brand:#7cc2a0; --accent:#6fb894; --accent-soft:#16241c;
  --ok:#5bb98b; --ok-bg:#15251c; --warn:#c79a68; --warn-bg:#282115; --crit:#e08a6c; --crit-bg:#2c1c16;
  --rail:#0b0f0c; --rail-deep:#070a08; --rail-ink:#eff3ed;
  --rail-muted:rgba(239,243,237,0.5); --rail-hover:rgba(255,255,255,0.06); --rail-active:rgba(255,255,255,0.1); --rail-line:rgba(239,243,237,0.1);
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --canvas:#0f1310; --surface:#171c15; --raised:#1b211a; --sunk:#121711;
  --ink:#eff1e8; --muted:#9ba193; --faint:#7a8073; --line:#2a302a; --hair:#212720;
  --brand:#7cc2a0; --accent:#6fb894; --accent-soft:#16241c;
  --ok:#5bb98b; --ok-bg:#15251c; --warn:#c79a68; --warn-bg:#282115; --crit:#e08a6c; --crit-bg:#2c1c16;
  --rail:#0b0f0c; --rail-deep:#070a08; --rail-ink:#eff3ed;
  --rail-muted:rgba(239,243,237,0.5); --rail-hover:rgba(255,255,255,0.06); --rail-active:rgba(255,255,255,0.1); --rail-line:rgba(239,243,237,0.1);
  color-scheme:dark; }

* { box-sizing:border-box; }
body { margin:0; background:var(--canvas); color:var(--ink); font-family:var(--f-ui); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }
h1,h2,h3,h4,p,ul,ol,figure { margin:0; } ul,ol { padding:0; list-style:none; }
button { font:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:3px; }
img { max-width:100%; display:block; }

/* shell */
.app { display:grid; grid-template-columns:var(--rail-w) minmax(0,1fr); min-height:100vh; }
.rail { background:var(--rail); color:var(--rail-ink); display:flex; flex-direction:column; border-right:1px solid var(--rail-line); position:sticky; top:0; height:100vh; overflow-y:auto; }
.rail__brand { display:flex; align-items:center; gap:10px; padding:18px 18px 14px; }
.rail__mark { border-radius:8px; flex:none; }
.rail__word { font-weight:600; font-size:15px; letter-spacing:.17em; }
.rail__venue { margin:0 12px 14px; padding:11px 12px; border:1px solid var(--rail-line); border-radius:var(--r-md); background:var(--rail-deep); display:flex; align-items:center; gap:10px; }
.rail__venue-initials { width:28px; height:28px; flex:none; border-radius:7px; background:var(--accent); color:#08110c; display:grid; place-items:center; font-weight:700; font-size:11.5px; }
.rail__venue-name { font-weight:600; font-size:13.5px; line-height:1.25; }
.rail__venue-meta { font-size:11.5px; color:var(--rail-muted); }
.rail__group-label { padding:0 20px 7px; font-size:10px; font-weight:600; letter-spacing:.15em; text-transform:uppercase; color:var(--rail-muted); }
.rail__nav { display:flex; flex-direction:column; gap:1px; padding:4px 10px; }
.navitem { display:flex; align-items:center; gap:11px; width:100%; padding:9px 10px; border:0; border-radius:8px; background:transparent; color:var(--rail-muted); font-size:13.5px; font-weight:500; cursor:pointer; text-align:left; transition:background 120ms,color 120ms; }
.navitem:hover { background:var(--rail-hover); color:var(--rail-ink); }
.navitem[aria-current="page"] { background:var(--rail-active); color:var(--rail-ink); font-weight:600; }
.navitem svg { flex:none; opacity:.9; }
.navitem__count { margin-left:auto; font-family:var(--f-num); font-size:11px; font-weight:600; padding:1px 6px; border-radius:999px; background:var(--crit); color:#fff; }
.rail__foot { margin-top:auto; padding:14px 12px 16px; display:grid; gap:10px; }
.proto { display:flex; gap:9px; align-items:flex-start; padding:10px 11px; border:1px dashed var(--rail-line); border-radius:var(--r-md); font-size:11.5px; line-height:1.45; color:var(--rail-muted); }
.proto strong { color:var(--rail-ink); font-weight:600; display:block; }
.foot-btns { display:flex; gap:8px; }
.foot-btn { flex:1; display:flex; align-items:center; justify-content:center; gap:7px; padding:9px 11px; border:1px solid var(--rail-line); border-radius:8px; background:transparent; color:var(--rail-muted); font-size:12px; cursor:pointer; }
.foot-btn:hover { background:var(--rail-hover); color:var(--rail-ink); }

.main { min-width:0; display:flex; flex-direction:column; }
.topbar { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:18px 28px 15px; border-bottom:1px solid var(--hair); background:var(--canvas); position:sticky; top:0; z-index:20; }
.topbar__l { min-width:0; }
.topbar__title { font-family:var(--f-display); font-size:29px; line-height:1.05; }
.topbar__sub { color:var(--muted); font-size:13px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.topbar__r { display:flex; align-items:center; gap:8px; flex:none; }
.period { display:flex; align-items:center; gap:8px; padding:7px 13px; border:1px solid var(--line); border-radius:999px; background:var(--surface); font-size:12.5px; font-weight:500; white-space:nowrap; }
.period__dot { width:6px; height:6px; border-radius:50%; background:var(--accent); }
.addbtn { display:inline-flex; align-items:center; gap:7px; padding:8px 15px; border-radius:999px; border:1px solid var(--brand); background:var(--brand); color:#fff; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; }
:root[data-theme="dark"] .addbtn, :root:not([data-theme="light"]) .addbtn { color:#08110c; }
@media (prefers-color-scheme:light){ :root:not([data-theme="dark"]) .addbtn { color:#fff; } }
.addbtn:hover { filter:brightness(1.12); }

.appbar-brand { display:none; align-items:center; gap:9px; }
.appbar-brand .rail__word { color:var(--ink); font-size:14px; }
.tabbar { display:none; }

.screen { padding:22px 28px 56px; display:grid; gap:20px; }

/* blocks */
.panel { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); }
.panel__head { display:flex; align-items:baseline; justify-content:space-between; gap:14px; flex-wrap:wrap; padding:14px 18px; border-bottom:1px solid var(--hair); }
.panel__title { font-size:14px; font-weight:600; }
.panel__note { font-size:12px; color:var(--muted); }
.panel__body { padding:16px 18px; }
.eyebrow { font-size:10.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); }

.hero__grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.05fr); gap:26px; padding:20px 22px; align-items:center; }
.hero__status { font-family:var(--f-display); font-size:30px; line-height:1.08; margin-top:8px; text-wrap:balance; }
.hero__sub { color:var(--muted); font-size:13.5px; margin-top:8px; max-width:46ch; line-height:1.55; }
.hero__badge { display:inline-flex; align-items:center; gap:7px; padding:4px 12px; border-radius:999px; font-size:12px; font-weight:600; }
.hero__badge svg { width:14px; height:14px; }
.signals { display:flex; gap:26px; flex-wrap:wrap; margin-top:18px; }
.signal__lab { font-size:11px; color:var(--muted); }
.signal__val { font-family:var(--f-display); font-size:25px; line-height:1; margin-top:4px; font-variant-numeric:tabular-nums; }
.hero__chart { border-left:1px solid var(--hair); padding-left:26px; }

/* dashboard */
.dash-hero { display:grid; grid-template-columns:auto minmax(0,1fr); gap:24px; padding:20px 22px; align-items:center; }
.gaugecard { display:flex; flex-direction:column; align-items:center; gap:8px; min-width:220px; }
.gaugecard__badge { display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:999px; font-size:11.5px; font-weight:600; }
.gaugecard__badge svg { width:13px; height:13px; }
.gaugecard__cap { font-size:11.5px; color:var(--muted); text-align:center; }
.dash-read { min-width:0; }
.dash-read__title { font-family:var(--f-display); font-size:26px; line-height:1.1; text-wrap:balance; }
.dash-read__sub { color:var(--muted); font-size:13px; margin-top:6px; max-width:52ch; line-height:1.5; }
.tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr)); gap:12px; margin-top:16px; }
.tile { border:1px solid var(--line); border-radius:var(--r-md); padding:12px 13px; background:var(--surface); display:grid; gap:6px; }
.tile__top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.tile__lab { font-size:11px; color:var(--muted); font-weight:500; }
.tile__val { font-family:var(--f-display); font-size:25px; line-height:1; font-variant-numeric:tabular-nums; }
.tile__val small { font-family:var(--f-ui); font-size:12px; color:var(--muted); }
.tile__spark { margin-top:2px; }
.deltachip { display:inline-flex; align-items:center; gap:3px; font-family:var(--f-num); font-size:11px; font-weight:600; padding:1px 6px; border-radius:999px; }
.deltachip--up { color:var(--ok); background:var(--ok-bg); } .deltachip--down { color:var(--crit); background:var(--crit-bg); } .deltachip--flat { color:var(--muted); background:var(--sunk); }
.donutwrap { display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
.dleg-list { display:grid; gap:7px; min-width:150px; flex:1; }
.dleg { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:8px; align-items:center; font-size:12.5px; cursor:default; }
.dleg__k { width:10px; height:10px; border-radius:3px; }
.dleg__n { color:var(--ink); } .dleg__v { font-family:var(--f-num); font-weight:600; color:var(--muted); }
.dleg:hover .dleg__n { color:var(--accent); }

.kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(178px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden; }
.kpi { background:var(--surface); padding:15px 17px 16px; }
.kpi__label { font-size:11.5px; color:var(--muted); font-weight:500; }
.kpi__val { font-family:var(--f-display); font-size:33px; line-height:1.05; margin-top:7px; font-variant-numeric:tabular-nums; }
.kpi__val small { font-family:var(--f-ui); font-size:14px; font-weight:500; color:var(--muted); margin-left:3px; }
.kpi__foot { font-size:11.5px; color:var(--muted); margin-top:6px; }
.meter { height:5px; border-radius:3px; background:var(--sunk); margin-top:10px; position:relative; overflow:hidden; }
.meter__fill { position:absolute; inset:0 auto 0 0; border-radius:3px; transition:width 350ms; }
.meter__target { position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink); opacity:.45; }

.table { width:100%; border-collapse:collapse; font-size:13px; }
.table th { text-align:left; font-size:10.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); padding:0 12px 9px; border-bottom:1px solid var(--line); white-space:nowrap; }
.table td { padding:10px 12px; border-bottom:1px solid var(--hair); vertical-align:middle; }
.table tr:last-child td { border-bottom:0; }
.table .num { text-align:right; font-family:var(--f-num); font-variant-numeric:tabular-nums; white-space:nowrap; }
.table th.num { text-align:right; }
.table__scroll { overflow-x:auto; }
.rowlink { cursor:pointer; }
.rowlink:hover td { background:var(--accent-soft); }
.rowlink:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
.dish__name { font-weight:600; }
.dish__fam { font-size:11.5px; color:var(--faint); }
.linklike { background:none; border:0; padding:0; cursor:pointer; text-align:left; }
.linklike .dish__name { text-decoration:underline; text-decoration-color:transparent; text-underline-offset:3px; transition:text-decoration-color 120ms; }
.linklike:hover .dish__name { text-decoration-color:var(--accent); color:var(--accent); }

.pill { display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600; white-space:nowrap; }
.pill::before { content:""; width:5px; height:5px; border-radius:50%; background:currentColor; }
.pill--ok { color:var(--ok); background:var(--ok-bg); } .pill--warn { color:var(--warn); background:var(--warn-bg); }
.pill--crit { color:var(--crit); background:var(--crit-bg); } .pill--flat { color:var(--muted); background:var(--sunk); }
.pill--flat::before { display:none; }
.delta { font-family:var(--f-num); font-size:11.5px; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap; }
.delta--up { color:var(--crit); } .delta--down { color:var(--ok); } .delta--flat { color:var(--faint); }

.catbar { display:flex; gap:7px; flex-wrap:wrap; }
.catchip { display:inline-flex; align-items:center; font-family:var(--f-ui); font-size:12px; font-weight:600; color:var(--muted); background:var(--sunk); border:1px solid var(--line); padding:6px 12px; border-radius:999px; cursor:pointer; white-space:nowrap; transition:background 120ms,color 120ms,border-color 120ms; }
.catchip:hover { color:var(--ink); border-color:var(--accent); }
.catchip--on { color:var(--canvas); background:var(--accent); border-color:var(--accent); }
.catchip__n { opacity:.55; margin-left:6px; font-family:var(--f-num); font-weight:600; }
.catchip--on .catchip__n { opacity:.8; }
.catchip--grp { background:transparent; color:var(--faint); border-style:dashed; text-transform:uppercase; letter-spacing:.06em; font-size:10.5px; padding:6px 10px; pointer-events:none; }
.cat-sub td { background:var(--sunk); padding:9px 12px; border-bottom:1px solid var(--line); }
.cat-sub__name { font-family:var(--f-ui); font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.cat-sub__grp { color:var(--faint); font-weight:600; text-transform:none; letter-spacing:0; margin-left:8px; font-size:11px; }
.cat-sub__n { float:right; font-family:var(--f-num); font-size:11px; font-weight:600; color:var(--faint); text-transform:none; letter-spacing:0; }

.provinfo { display:flex; flex-direction:column; gap:10px; padding:14px 16px; background:var(--sunk); border:1px solid var(--line); border-radius:12px; }
.provinfo__row { display:flex; align-items:flex-start; gap:10px; font-size:13px; color:var(--ink); line-height:1.45; }
.provinfo__row svg { color:var(--accent); flex:0 0 auto; margin-top:1px; }
.provinfo__row a { color:inherit; text-decoration:none; }
.provinfo__row a:hover { text-decoration:underline; }
.provinfo__lab { font-size:10.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); }

.alert { display:grid; grid-template-columns:auto minmax(0,1fr); gap:14px; padding:16px 18px; border:1px solid var(--line); border-radius:var(--r-lg); background:var(--surface); border-left:3px solid var(--warn); }
.alert--crit { border-left-color:var(--crit); }
.alert__icon { color:var(--warn); margin-top:1px; } .alert--crit .alert__icon { color:var(--crit); }
.alert__title { font-weight:600; font-size:14.5px; }
.alert__body { color:var(--muted); font-size:13px; margin-top:4px; max-width:70ch; }
.alert__figs { display:flex; gap:22px; flex-wrap:wrap; margin-top:12px; }
.alert__fig-val { font-family:var(--f-display); font-size:24px; line-height:1; font-variant-numeric:tabular-nums; }
.alert__fig-lab { font-size:10.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--faint); margin-top:5px; }
.alert__actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }

.btn { display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:12.5px; font-weight:600; cursor:pointer; transition:background 120ms,border-color 120ms; }
.btn:hover { background:var(--sunk); }
.btn--primary { background:var(--brand); border-color:var(--brand); color:#fff; }
.btn--primary:hover { filter:brightness(1.14); }
:root[data-theme="dark"] .btn--primary, :root:not([data-theme="light"]) .btn--primary { color:#08110c; }
@media (prefers-color-scheme:light){ :root:not([data-theme="dark"]) .btn--primary { color:#fff; } }
.btn--ghost { background:transparent; }
.btn--sm { padding:5px 10px; font-size:12px; }
.btn:disabled { opacity:.45; cursor:not-allowed; }

.split { display:grid; grid-template-columns:minmax(0,1.55fr) minmax(0,1fr); gap:20px; align-items:start; }
.stack { display:grid; gap:20px; align-content:start; }

.feed { display:grid; }
.feed__row { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px; align-items:center; padding:11px 0; border-bottom:1px solid var(--hair); }
.feed__row:last-child { border-bottom:0; }
.feed__what { font-weight:500; } .feed__meta { font-size:11.5px; color:var(--muted); }
.swatch { width:7px; height:26px; border-radius:2px; flex:none; }
.cover { display:flex; align-items:center; gap:10px; min-width:132px; }
.cover__track { flex:1; height:6px; border-radius:3px; background:var(--sunk); overflow:hidden; min-width:54px; }
.cover__fill { height:100%; border-radius:3px; transition:width 350ms; }
.cover__min { font-family:var(--f-num); font-size:11px; color:var(--faint); }

.barh { display:grid; gap:12px; }
.barh__row { display:grid; grid-template-columns:96px minmax(0,1fr) auto; gap:12px; align-items:center; }
.barh__label { font-size:12.5px; font-weight:500; }
.barh__track { height:22px; border-radius:5px; background:var(--sunk); overflow:hidden; }
.barh__fill { height:100%; border-radius:5px; transition:width 400ms; }
.barh__val { font-family:var(--f-num); font-size:12.5px; font-weight:600; font-variant-numeric:tabular-nums; }
.barh__row:hover .barh__fill { filter:brightness(1.08); }

.recipe__row { display:grid; grid-template-columns:minmax(120px,1.6fr) 88px 92px 62px 78px 30px; gap:9px; align-items:center; padding:9px 0; border-bottom:1px solid var(--hair); }
.recipe__head { font-size:10.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--faint); border-bottom:1px solid var(--line); padding-bottom:8px; }
.recipe__head > *:not(:first-child), .recipe__row > *:not(:first-child) { text-align:right; }
.recipe__name { font-weight:500; display:flex; align-items:center; gap:7px; min-width:0; }
.recipe__name > span:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tag-elab { font-size:9.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); background:var(--accent-soft); border-radius:4px; padding:1px 5px; flex:none; }
.recipe__cost { font-family:var(--f-num); font-weight:600; font-variant-numeric:tabular-nums; }
.rmline { border:0; background:transparent; color:var(--faint); cursor:pointer; padding:4px; border-radius:6px; }
.rmline:hover { color:var(--crit); background:var(--crit-bg); }
.inp { width:100%; padding:5px 8px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--raised); color:var(--ink); font-family:var(--f-num); font-size:12.5px; font-variant-numeric:tabular-nums; text-align:right; }
.inp:hover { border-color:var(--accent); } .inp:focus { outline:2px solid var(--accent); outline-offset:-1px; border-color:var(--accent); }
.inp--wide { max-width:120px; }
.inp-unit { display:flex; align-items:center; gap:5px; } .inp-unit span { font-size:11px; color:var(--faint); }
.field { display:grid; gap:6px; }
.field label { font-size:12px; font-weight:600; color:var(--muted); }
.field .inp, .field select, .field input, .field textarea { text-align:left; }
select.inp, .field select { text-align:left; font-family:var(--f-ui); }
.field input, .field select, .field textarea { width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--raised); color:var(--ink); font-family:var(--f-ui); font-size:13.5px; }

/* ===== Sincronización con la nube (D1) — reemplaza el "solo en el navegador" ===== */
let __syncTimer=null, __syncing=false, __dirty=false, __lastSaved="";
function setSyncBadge(kind){
  const el=document.getElementById("syncbadge"); if(!el) return;
  const map={ saving:["Guardando…","var(--muted)"], saved:["Guardado ✓","var(--ok,#2e8b57)"], offline:["Sin conexión","var(--warn,#b98e5a)"], error:["Error al guardar","var(--crit,#c0392b)"] };
  const v=map[kind]||map.saved; el.textContent=v[0]; el.style.color=v[1];
}
function syncPush(){ __dirty=true; clearTimeout(__syncTimer); __syncTimer=setTimeout(flushSync,800); }
async function flushSync(){
  if(__syncing) return;
  const body=JSON.stringify(STATE);
  if(body===__lastSaved){ __dirty=false; return; }
  __syncing=true; __dirty=false; setSyncBadge("saving");
  try{
    const r=await fetch("/api/state",{method:"PUT",headers:{"Content-Type":"application/json"},body});
    if(r.status===401){ location.href="/login"; return; }
    if(!r.ok) throw new Error(String(r.status));
    __lastSaved=body; setSyncBadge("saved");
  }catch(e){ setSyncBadge("offline"); }
  finally{ __syncing=false; if(__dirty){ clearTimeout(__syncTimer); __syncTimer=setTimeout(flushSync,800); } }
}
async function bootFromServer(){
  try{
    const r=await fetch("/api/state",{headers:{"Accept":"application/json"}});
    if(r.status===401){ location.href="/login"; return "redirect"; }
    if(r.ok){
      const j=await r.json();
      if(j&&j.ok&&j.data&&j.data.v===7&&j.data.productos){ STATE=j.data; __lastSaved=JSON.stringify(STATE); return "loaded"; }
      if(j&&j.ok&&j.data===null){ __lastSaved=""; syncPush(); return "empty"; } /* primera vez: sube el estado por defecto */
    }
  }catch(e){}
  return "offline"; /* sin conexión: seguimos con lo que haya en el navegador */
}
function mountSyncUI(){
  if(document.getElementById("syncbadge")) return;
  const anchor=document.getElementById("add")||document.getElementById("theme")||document.getElementById("reset");
  const bar=anchor?anchor.parentElement:document.body;
  const badge=document.createElement("span");
  badge.id="syncbadge"; badge.textContent="Guardado ✓";

  out.addEventListener("click",async()=>{ try{ await fetch("/api/logout",{method:"POST"}); }catch(e){} location.href="/login"; });
  bar.appendChild(badge); bar.appendChild(out);
}

const FACTOR = {g:0.001,ml:0.001,kg:1,L:1,ud:1};
const udReceta = (ud) => ud==="kg"?"g":ud==="L"?"ml":"ud";
const precioNeto = (id) => { const p=prod(id); return p.precio/(1-(p.merma||0)/100); };
const costeLinea = (l) => precioNeto(l.prod)*l.cant*FACTOR[l.ud];
function costePlato(pl){ if(pl.tipo==="reventa") return pl.coste||0; return (pl.receta||[]).reduce((t,l)=>t+costeLinea(l),0); }
const foodCost = (c,pvp) => pvp>0?(c/pvp)*100:0;
function estadoFC(fc){ if(fc<=OBJETIVO_FC)return{key:"ok",label:"En objetivo",cls:"pill--ok",color:"var(--ok)"}; if(fc<=OBJETIVO_FC+3)return{key:"warn",label:"Ajustado",cls:"pill--warn",color:"var(--warn)"}; return{key:"crit",label:"Revisar",cls:"pill--crit",color:"var(--crit)"}; }
function resumenCarta(){ let c=0,i=0,u=0; STATE.platos.forEach(p=>{c+=costePlato(p)*p.ventas;i+=p.pvp*p.ventas;u+=p.ventas;}); return {coste:c,ingresos:i,unidades:u,margen:i-c,fc:foodCost(c,i)}; }
function simular(prodId,pctSubida){ const f=1+pctSubida/100; const af=STATE.platos.filter(p=>p.receta.some(l=>l.prod===prodId)); let ca=0,cd=0,ing=0; STATE.platos.forEach(p=>{ing+=p.pvp*p.ventas;p.receta.forEach(l=>{const b=costeLinea(l)*p.ventas;ca+=b;cd+=l.prod===prodId?b*f:b;});}); const salen=af.filter(p=>{const a=costePlato(p);let d=0;p.receta.forEach(l=>{d+=l.prod===prodId?costeLinea(l)*f:costeLinea(l);});return foodCost(a,p.pvp)<=OBJETIVO_FC&&foodCost(d,p.pvp)>OBJETIVO_FC;}); return {afectados:af.length,platos:af,salenDeObjetivo:salen,fcAntes:foodCost(ca,ing),fcDespues:foodCost(cd,ing),impacto:cd-ca}; }
const fueraDeObjetivo = () => STATE.platos.filter(p=>foodCost(costePlato(p),p.pvp)>OBJETIVO_FC);
const stockBajo = () => STATE.inventario.filter(it=>it.stock<it.minimo);
const valorAlmacen = () => STATE.inventario.reduce((t,it)=>t+it.stock*prod(it.prod).precio,0);
const coberturaDias = (it) => it.consumo>0?it.stock/(it.consumo/7):99;
function estadoStock(it){ const d=coberturaDias(it); if(it.stock<it.minimo)return{label:"Bajo mínimo",cls:"pill--crit",color:"var(--crit)",dias:d}; if(d<6)return{label:"Ajustado",cls:"pill--warn",color:"var(--warn)",dias:d}; return{label:"Correcto",cls:"pill--ok",color:"var(--ok)",dias:d}; }
const totalAlbaran = (a) => a.lineas.reduce((t,l)=>t+l.cant*l.precio,0);
function margenPorFamilia(){ const f={}; STATE.platos.forEach(p=>{f[p.familia]=(f[p.familia]||0)+(p.pvp-costePlato(p))*p.ventas;}); return Object.keys(f).map(k=>({familia:k,margen:f[k]})).sort((a,b)=>b.margen-a.margen); }
function saludLocal(){ const r=resumenCarta(),fuera=fueraDeObjetivo().length,bajos=stockBajo().length; let tone,title; if(r.fc<=OBJETIVO_FC&&bajos<=1&&fuera<=2){tone="ok";title="El local va bien este mes";}else if(r.fc<=OBJETIVO_FC+2&&bajos<=3){tone="warn";title="Atención en un par de frentes";}else{tone="crit";title="Hay que tomar decisiones";} return {tone,title,r,fuera,bajos}; }

// Avisos dinámicos: se generan del último cambio de precio de cada producto en los albaranes.
function alertasPrecio(){
  const vistos = {}; const out = [];
  allAlbaranes().forEach(a => a.lineas.forEach(l => {
    if (vistos[l.prod]) return; vistos[l.prod] = true;
    if (l.ant && l.precio !== l.ant) {
      const pctv = ((l.precio - l.ant)/l.ant)*100;
      const sim = simular(l.prod, pctv);
      if (sim.afectados > 0) out.push({prod:l.prod, precio:l.precio, ant:l.ant, pct:pctv, fecha:a.fecha, prov:a.prov, sim});
    }
  }));
  return out.filter(a=>a.pct>0).sort((a,b)=>b.sim.impacto-a.sim.impacto);
}

function lineChart(values,opts){
  const o=Object.assign({w:380,h:150,unit:"%",labels:[],objetivo:null,color:"var(--accent)"},opts||{});
  const ML=40,MR=14,MT=12,MB=24; const fmt=v=>o.unit==="%"?pct(v):eur(v);
  let lo=Math.min.apply(null,values),hi=Math.max.apply(null,values);
  if(o.objetivo!=null){lo=Math.min(lo,o.objetivo);hi=Math.max(hi,o.objetivo);}
  const pad=(hi-lo)*0.18||1; lo-=pad; hi+=pad;
  const px=i=>ML+(i/(values.length-1))*(o.w-ML-MR); const py=v=>o.h-MB-((v-lo)/(hi-lo))*(o.h-MT-MB);
  const pts=values.map((v,i)=>[px(i),py(v)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const area=line+" L"+px(values.length-1).toFixed(1)+","+(o.h-MB)+" L"+ML+","+(o.h-MB)+" Z";
  let g='<svg class="lc" viewBox="0 0 '+o.w+" "+o.h+'" width="100%" height="'+o.h+'" role="img" aria-label="Evolución de '+fmt(values[0])+" a "+fmt(values[values.length-1])+'">';
  [lo+pad,(lo+hi)/2,hi-pad].forEach(v=>{const y=py(v);g+='<line x1="'+ML+'" y1="'+y.toFixed(1)+'" x2="'+(o.w-MR)+'" y2="'+y.toFixed(1)+'" stroke="var(--hair)"></line><text x="'+(ML-7)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" font-size="10" fill="var(--faint)">'+(o.unit==="%"?nf(v,0)+"%":nf(v,0))+"</text>";});
  if(o.objetivo!=null){const yo=py(o.objetivo);g+='<line x1="'+ML+'" y1="'+yo.toFixed(1)+'" x2="'+(o.w-MR)+'" y2="'+yo.toFixed(1)+'" stroke="var(--ink)" stroke-dasharray="4 3" opacity="0.4"></line><text x="'+(o.w-MR)+'" y="'+(yo-5).toFixed(1)+'" text-anchor="end" font-size="9.5" fill="var(--muted)">objetivo '+nf(o.objetivo,0)+"%</text>";}
  g+='<path d="'+area+'" fill="'+o.color+'" fill-opacity="0.12"></path><path d="'+line+'" fill="none" stroke="'+o.color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>';
  o.labels.forEach((lab,i)=>{g+='<text x="'+px(i).toFixed(1)+'" y="'+(o.h-7)+'" text-anchor="middle" font-size="10" fill="var(--faint)">'+esc(lab)+"</text>";});
  pts.forEach((p,i)=>{const u=i===values.length-1;g+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(u?3.6:2.4)+'" fill="'+o.color+'"></circle><circle class="lc__hit" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="12" fill="transparent" data-tip="'+esc((o.labels[i]||("P"+(i+1)))+"|"+fmt(values[i]))+'"></circle>';});
  return g+"</svg>";
}

function scatterCarta(){
  const datos=STATE.platos.map(p=>{const c=costePlato(p);return{plato:p,coste:c,margen:p.pvp-c,fc:foodCost(c,p.pvp),aporta:(p.pvp-c)*p.ventas};});
  const mV=datos.reduce((t,d)=>t+d.plato.ventas,0)/datos.length, mM=datos.reduce((t,d)=>t+d.margen,0)/datos.length;
  const cuad=d=>{const pop=d.plato.ventas>=mV,mar=d.margen>=mM;if(pop&&mar)return{nombre:"Estrella",color:"var(--ok)"};if(pop&&!mar)return{nombre:"Caballo de batalla",color:"var(--accent)"};if(!pop&&mar)return{nombre:"Enigma",color:"var(--warn)"};return{nombre:"Perro",color:"var(--crit)"};};
  const W=520,H=340,ML=54,MR=18,MT=16,MB=44;
  const maxV=Math.max.apply(null,datos.map(d=>d.plato.ventas))*1.12||1, maxM=Math.max.apply(null,datos.map(d=>d.margen))*1.14||1;
  const sx=v=>ML+(v/maxV)*(W-ML-MR), sy=m=>H-MB-(m/maxM)*(H-MT-MB); const xm=sx(mV),ym=sy(mM);
  let s='<svg viewBox="0 0 '+W+" "+H+'" width="100%" style="max-width:100%;height:auto" role="img" aria-label="Matriz de carta.">';
  s+='<rect x="'+xm+'" y="'+MT+'" width="'+(W-MR-xm)+'" height="'+(ym-MT)+'" fill="var(--ok)" fill-opacity="0.07"></rect><rect x="'+ML+'" y="'+MT+'" width="'+(xm-ML)+'" height="'+(ym-MT)+'" fill="var(--warn)" fill-opacity="0.07"></rect><rect x="'+xm+'" y="'+ym+'" width="'+(W-MR-xm)+'" height="'+(H-MB-ym)+'" fill="var(--accent)" fill-opacity="0.07"></rect><rect x="'+ML+'" y="'+ym+'" width="'+(xm-ML)+'" height="'+(H-MB-ym)+'" fill="var(--crit)" fill-opacity="0.06"></rect>';
  s+='<line x1="'+ML+'" y1="'+(H-MB)+'" x2="'+(W-MR)+'" y2="'+(H-MB)+'" stroke="var(--line)"></line><line x1="'+ML+'" y1="'+MT+'" x2="'+ML+'" y2="'+(H-MB)+'" stroke="var(--line)"></line><line x1="'+xm+'" y1="'+MT+'" x2="'+xm+'" y2="'+(H-MB)+'" stroke="var(--muted)" stroke-dasharray="3 3" opacity="0.55"></line><line x1="'+ML+'" y1="'+ym+'" x2="'+(W-MR)+'" y2="'+ym+'" stroke="var(--muted)" stroke-dasharray="3 3" opacity="0.55"></line>';
  [0,mM,maxM*0.88].forEach(m=>{s+='<text x="'+(ML-8)+'" y="'+(sy(m)+4)+'" text-anchor="end" font-size="10.5" fill="var(--faint)" font-family="IBM Plex Mono,monospace">'+nf(m,0)+" €</text>";});
  [0,mV,maxV*0.9].forEach(v=>{s+='<text x="'+sx(v)+'" y="'+(H-MB+16)+'" text-anchor="middle" font-size="10.5" fill="var(--faint)" font-family="IBM Plex Mono,monospace">'+nf(v,0)+"</text>";});
  s+='<text x="'+((ML+W-MR)/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" fill="var(--muted)">Unidades vendidas al mes</text><text x="14" y="'+((MT+H-MB)/2)+'" text-anchor="middle" font-size="11" fill="var(--muted)" transform="rotate(-90 14 '+((MT+H-MB)/2)+')">Margen por plato</text>';
  datos.forEach(d=>{const q=cuad(d),x=sx(d.plato.ventas),y=sy(d.margen),der=x<W-MR-92;s+='<circle class="pt" cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="6" fill="'+q.color+'" fill-opacity="0.92" stroke="var(--surface)" stroke-width="1.6" data-dish="'+d.plato.id+'" data-tip="'+esc(d.plato.nombre+"|"+q.nombre+"|"+d.plato.ventas+" uds · "+eur(d.margen)+" margen|Aporta "+eur(d.aporta,0)+"/mes")+'"></circle><text x="'+(der?x+10:x-10).toFixed(1)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="'+(der?"start":"end")+'" font-size="10.5" fill="var(--ink)" pointer-events="none">'+esc(d.plato.nombre)+"</text>";});
  return {svg:s+"</svg>",datos,mediaV:mV,mediaM:mM,cuad};
}

// Sparkline mínima para tiles.
function spark(values,color,w,h){
  w=w||96;h=h||30;const lo=Math.min.apply(null,values),hi=Math.max.apply(null,values),sp=hi-lo||1;
  const px=i=>2+(i/(values.length-1))*(w-4),py=v=>h-3-((v-lo)/sp)*(h-6);
  const pts=values.map((v,i)=>[px(i),py(v)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" height="${h}" preserveAspectRatio="none" aria-hidden="true" style="display:block;width:100%"><path d="${line} L${(w-2).toFixed(1)},${h} L2,${h} Z" fill="${color}" fill-opacity="0.12"></path><path d="${line}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.3" fill="${color}"></circle></svg>`;
}

// Gauge semicircular (0..max) con marca de objetivo y color por estado.
function gauge(value,max,objetivo,color,label,sub){
  const W=230,H=140,cx=W/2,cy=125,r=95,sw=16;
  const ang=t=>Math.PI*(1-t); // t 0..1 -> 180..0 grados
  const pt=(t,rad)=>[cx+rad*Math.cos(ang(t)),cy-rad*Math.sin(ang(t))];
  // El barrido cubre como máximo media vuelta (180°), así que large-arc-flag siempre 0.
  const arc=(t0,t1,rad,col,width)=>{const a=pt(t0,rad),b=pt(t1,rad);return `<path d="M${a[0].toFixed(1)},${a[1].toFixed(1)} A${rad},${rad} 0 0 1 ${b[0].toFixed(1)},${b[1].toFixed(1)}" fill="none" stroke="${col}" stroke-width="${width}" stroke-linecap="round"></path>`;};
  const tv=Math.max(0,Math.min(1,value/max));
  const to=Math.max(0,Math.min(1,objetivo/max));
  const otick=pt(to,r);const otick2=pt(to,r-sw-4);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:260px;height:auto" role="img" aria-label="${esc(label)}: ${esc(sub)}">
    ${arc(0,1,r,"var(--sunk)",sw)}
    ${arc(0,tv,r,color,sw)}
    <line x1="${otick[0].toFixed(1)}" y1="${otick[1].toFixed(1)}" x2="${otick2[0].toFixed(1)}" y2="${otick2[1].toFixed(1)}" stroke="var(--ink)" stroke-width="2.5"></line>
    <text x="${cx}" y="${cy-24}" text-anchor="middle" font-family="var(--f-display)" font-size="38" fill="var(--ink)">${esc(label)}</text>
    <text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(sub)}</text>
  </svg>`;
}

// Donut con leyenda interactiva.
function donut(items,opts){
  opts=opts||{};const size=opts.size||168,sw=opts.sw||26,cx=size/2,cy=size/2,r=(size-sw)/2-2;
  const total=items.reduce((t,i)=>t+i.value,0)||1;
  let a0=-Math.PI/2;let seg="";
  items.forEach(it=>{const frac=it.value/total,a1=a0+frac*Math.PI*2;const large=frac>0.5?1:0;
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    seg+=`<path d="M${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 ${large} 1 ${x1.toFixed(1)},${y1.toFixed(1)}" fill="none" stroke="${it.color}" stroke-width="${sw}" data-tip="${esc(it.label+"|"+(opts.fmt?opts.fmt(it.value):it.value)+"|"+nf(frac*100,0)+" %")}" style="cursor:pointer"></path>`;
    a0=a1;});
  const svg=`<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="${esc(opts.aria||"Distribución")}"><g>${seg}</g><text x="${cx}" y="${cy-4}" text-anchor="middle" font-family="var(--f-display)" font-size="22" fill="var(--ink)">${esc(opts.centerTop||"")}</text><text x="${cx}" y="${cy+13}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${esc(opts.centerSub||"")}</text></svg>`;
  const leg=items.map(it=>`<div class="dleg" data-tip="${esc(it.label+"|"+(opts.fmt?opts.fmt(it.value):it.value))}"><span class="dleg__k" style="background:${it.color}"></span><span class="dleg__n">${esc(it.label)}</span><span class="dleg__v">${opts.fmt?opts.fmt(it.value):it.value}</span></div>`).join("");
  return `<div class="donutwrap"><div>${svg}</div><div class="dleg-list">${leg}</div></div>`;
}

document.addEventListener("mouseover",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(!el)return;tip.innerHTML=el.getAttribute("data-tip").split("|").map((t,i)=>i===0?"<strong>"+esc(t)+"</strong>":"<span>"+esc(t)+"</span>").join("");tip.classList.add("show");});

document.addEventListener("mousemove",e=>{if(!tip.classList.contains("show"))return;const pad=15,r=tip.getBoundingClientRect();let x=e.clientX+pad,y=e.clientY+pad;if(x+r.width>innerWidth-8)x=e.clientX-r.width-pad;if(y+r.height>innerHeight-8)y=e.clientY-r.height-pad;tip.style.left=x+"px";tip.style.top=y+"px";});
window.addEventListener("scroll",()=>tip.classList.remove("show"),true);

let toastT=null;
function toast(msg){ const el=document.getElementById("toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),2600); }

function pickFile(onData, accept, camera){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=accept||"image/*";
  if(camera) inp.setAttribute("capture","environment");
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>onData(r.result,f); r.readAsDataURL(f); };
  inp.click();
}

let ficha=null;
function snap(p){ if(p.tipo==="reventa") return {tipo:"reventa",coste:p.coste||0,margen:p.margen||0,pvp:p.pvp,ventas:p.ventas}; const precios={},mermas={}; p.receta.forEach(l=>{precios[l.prod]=prod(l.prod).precio;mermas[l.prod]=prod(l.prod).merma||0;}); return {pvp:p.pvp,ventas:p.ventas,receta:p.receta.map(l=>({prod:l.prod,cant:l.cant,ud:l.ud})),precios,mermas}; }
function costeSnap(s){ if(s.tipo==="reventa") return s.coste||0; return s.receta.reduce((t,l)=>t+(s.precios[l.prod]/(1-(s.mermas[l.prod]||0)/100))*l.cant*FACTOR[l.ud],0); }
function fichaDirty(){ return JSON.stringify(ficha.base)!==JSON.stringify(ficha.draft); }

function pintarFichaReventa(){
  const d=ficha.draft,b=ficha.base;
  const coste=d.coste||0,pvp=d.pvp||0,margen=pvp-coste,costePct=pvp>0?(coste/pvp)*100:0,mult=coste>0?pvp/coste:0;
  const set=(id,v,c)=>{const el=document.getElementById(id);if(el){el.textContent=v;if(c)el.style.color=c;}};
  set("t-coste",eur(coste));set("t-pvp",eur(pvp));set("t-fc",pct(costePct),"var(--ink)");set("t-margen",eur(margen),margen>=0?"var(--ink)":"var(--crit)");
  const hint=document.getElementById("t-hint"); if(hint)hint.innerHTML=icon("inteligencia",16)+`<span>Multiplicador aplicado: <b>×${nf(mult,2)}</b>. Cada unidad deja <b>${eur(margen)}</b> de beneficio (${pct(pvp>0?(margen/pvp)*100:0,0)} de margen sobre PVP).</span>`;
  const cB=b.coste||0,mB=(b.pvp||0)-cB,apB=mB*(b.ventas||0),apD=margen*(d.ventas||0),dirty=fichaDirty();
  const va=document.getElementById("t-valora");
  if(va){
    if(!dirty){ va.innerHTML=`<p style="font-size:13px;color:var(--muted);line-height:1.55">Cada unidad deja <b style="color:var(--ink);font-family:var(--f-num)">${eur(mB)}</b> de margen y aporta <b style="color:var(--ink);font-family:var(--f-num)">${eur(apB,0)}</b> al mes. Cambia el precio de compra, el margen o el PVP para ver el efecto.</p>`; }
    else{ const dM=margen-mB,dA=apD-apB; let tone,txt; if(dM>0.001){tone="ok";txt=`El margen sube <b>${eur(dM)}</b> por unidad${d.ventas?" y <b>"+eur(dA,0)+"</b> al mes":""}.`;} else if(dM<-0.001){tone="crit";txt=`El margen baja <b>${eur(Math.abs(dM))}</b> por unidad${d.ventas?" y <b>"+eur(Math.abs(dA),0)+"</b> al mes":""}.`;} else{tone="warn";txt="El margen queda igual.";}
      va.innerHTML=`<div class="valora"><div class="compare"><div class="compare__col"><div class="compare__lab">Margen antes</div><div class="compare__val">${eur(mB)}</div></div><div class="compare__arrow">${icon("flecha",18)}</div><div class="compare__col"><div class="compare__lab">Margen ahora</div><div class="compare__val" style="color:${dM>=0?"var(--ok)":"var(--crit)"}">${eur(margen)}</div></div></div><div class="verdict verdict--${tone}">${txt}</div></div>`; }
  }
  const dn=document.getElementById("t-dirtynote"); if(dn)dn.textContent=dirty?"Cambios sin guardar":"Sin cambios";
  const ac=document.getElementById("t-accept"),dc=document.getElementById("t-discard"); if(ac)ac.disabled=!dirty; if(dc)dc.disabled=!dirty;
}
function pintarFicha(){
  if(ficha.draft.tipo==="reventa"){ pintarFichaReventa(); return; }
  const d=ficha.draft, b=ficha.base;
  let coste=0;
  d.receta.forEach((l,i)=>{const c=(d.precios[l.prod]/(1-(d.mermas[l.prod]||0)/100))*l.cant*FACTOR[l.ud];coste+=c;const cell=document.querySelector('[data-cost="'+i+'"]');if(cell)cell.textContent=eur(c);});
  const fc=foodCost(coste,d.pvp),margen=d.pvp-coste,st=estadoFC(fc);
  const set=(id,v,c)=>{const el=document.getElementById(id);if(el){el.textContent=v;if(c)el.style.color=c;}};
  set("t-coste",eur(coste));set("t-pvp",eur(d.pvp));set("t-fc",pct(fc),st.color);set("t-margen",eur(margen));
  const pvpObj=coste/(OBJETIVO_FC/100);
  const hint=document.getElementById("t-hint");
  if(hint)hint.innerHTML=icon("inteligencia",16)+`<span>Para un food cost del ${pct(OBJETIVO_FC,0)}, el PVP tendría que ser <b>${eur(pvpObj)}</b>${d.pvp>=pvpObj?". El actual ya lo cumple, con <b>"+eur(d.pvp-pvpObj)+"</b> de holgura.":", es decir <b>"+eur(pvpObj-d.pvp)+"</b> por encima del actual."}</span>`;

  // valoración antes/ahora
  const cB=costeSnap(b),mB=b.pvp-cB,fcB=foodCost(cB,b.pvp),apB=mB*b.ventas;
  const cD=coste,mD=margen,fcD=fc,apD=mD*d.ventas;
  const dirty=fichaDirty();
  const va=document.getElementById("t-valora");
  if(va){
    if(!dirty){
      va.innerHTML=`<p style="font-size:13px;color:var(--muted);line-height:1.55">Este plato deja <b style="color:var(--ink);font-family:var(--f-num)">${eur(mB)}</b> de margen (${pct(fcB)} de food cost) y aporta <b style="color:var(--ink);font-family:var(--f-num)">${eur(apB,0)}</b> al mes. Modifica la receta, el precio de compra o el PVP para ver si compensa cambiarlo.</p>`;
    } else {
      const dMargen=mD-mB, dApor=apD-apB;
      let tone,txt;
      if(dMargen>0.001){tone="ok";txt=`Te sale a cuenta: el margen sube <b>${eur(dMargen)}</b> por plato${d.ventas?" y <b>"+eur(dApor,0)+"</b> al mes":""}.`;}
      else if(dMargen<-0.001){tone="crit";txt=`Pierdes margen: <b>${eur(Math.abs(dMargen))}</b> menos por plato${d.ventas?" y <b>"+eur(Math.abs(dApor),0)+"</b> al mes":""}. Sube el PVP o ajusta la receta.`;}
      else {tone="warn";txt="El margen queda igual; cambian los ingredientes pero no el resultado.";}
      if(fcB<=OBJETIVO_FC&&fcD>OBJETIVO_FC)txt+=" Además, se sale del objetivo de food cost.";
      if(fcB>OBJETIVO_FC&&fcD<=OBJETIVO_FC)txt+=" Y vuelve a entrar en el objetivo de food cost.";
      va.innerHTML=`<div class="valora">
        <div class="compare">
          <div class="compare__col"><div class="compare__lab">Margen antes</div><div class="compare__val">${eur(mB)}</div></div>
          <div class="compare__arrow">${icon("flecha",18)}</div>
          <div class="compare__col"><div class="compare__lab">Margen ahora</div><div class="compare__val" style="color:${dMargen>=0?"var(--ok)":"var(--crit)"}">${eur(mD)}</div></div>
        </div>
        <div class="compare" style="font-size:12px">
          <div class="compare__col"><div class="compare__lab">Food cost</div><div style="font-family:var(--f-num);margin-top:3px">${pct(fcB)}</div></div>
          <div class="compare__arrow">${icon("flecha",14)}</div>
          <div class="compare__col"><div class="compare__lab">Food cost</div><div style="font-family:var(--f-num);margin-top:3px;color:${estadoFC(fcD).color}">${pct(fcD)}</div></div>
        </div>
        <div class="verdict verdict--${tone}">${txt}</div>
      </div>`;
    }
  }
  const dn=document.getElementById("t-dirtynote"); if(dn)dn.textContent=dirty?"Cambios sin guardar":"Sin cambios";
  const ac=document.getElementById("t-accept"),dc=document.getElementById("t-discard");
  if(ac)ac.disabled=!dirty; if(dc)dc.disabled=!dirty;

  const des=document.getElementById("t-desglose");
  if(des){const rows=d.receta.map(l=>{const c=(d.precios[l.prod]/(1-(d.mermas[l.prod]||0)/100))*l.cant*FACTOR[l.ud];return{l,c};}).sort((a,b)=>b.c-a.c);
    des.innerHTML=rows.map(x=>{const p=prod(x.l.prod),peso=coste>0?(x.c/coste)*100:0;return `<div class="feed__row"><span class="swatch" style="background:var(--accent);opacity:${(0.35+(peso/100)*0.65).toFixed(2)}"></span><div><div class="feed__what">${esc(p.nombre)}</div><div class="feed__meta">${eur(x.l.prod?(d.precios[x.l.prod]/(1-(d.mermas[x.l.prod]||0)/100)):0)}/${p.ud} neto · ${nf(peso,0)} % del coste</div></div><span class="recipe__cost">${eur(x.c)}</span></div>`;}).join("");}
}

function aceptarFicha(){
  const p=STATE.platos.find(x=>x.id===ficha.id); if(!p)return;
  const d=ficha.draft;
  if(d.tipo==="reventa"){
    p.coste=d.coste; p.margen=d.margen; p.pvp=d.pvp; p.ventas=d.ventas;
    save(); ficha.base=snap(p); toast("Cambios aplicados a "+p.nombre); pintarNavAll("carta"); pintarFicha(); return;
  }
  p.pvp=d.pvp; p.ventas=d.ventas; p.receta=d.receta.map(l=>({prod:l.prod,cant:l.cant,ud:l.ud}));
  d.receta.forEach(l=>{STATE.productos[l.prod]=Object.assign({},STATE.productos[l.prod],{precio:d.precios[l.prod],merma:d.mermas[l.prod]||0});});
  save();
  ficha.base=snap(p);
  toast("Cambios aplicados a "+p.nombre);
  pintarNavAll("escandallos");
  pintarFicha();
}
function wireFicha(){
  document.querySelectorAll("#screen input[data-f]").forEach(inp=>{
    inp.addEventListener("input",()=>{
      const v=parseFloat(inp.value),f=inp.dataset.f,d=ficha.draft;
      if(f==="pvp")d.pvp=isNaN(v)?0:v;
      else if(f==="ventas")d.ventas=isNaN(v)?0:Math.max(0,Math.round(v));
      else if(f==="rcoste"){d.coste=isNaN(v)?0:v;d.pvp=+revPvp(d.coste,d.margen||0).toFixed(2);const el=document.getElementById("rpvp-in");if(el&&document.activeElement!==el)el.value=d.pvp.toFixed(2);}
      else if(f==="rmargen"){d.margen=isNaN(v)?0:Math.min(99,Math.max(0,v));d.pvp=+revPvp(d.coste||0,d.margen).toFixed(2);const el=document.getElementById("rpvp-in");if(el&&document.activeElement!==el)el.value=d.pvp.toFixed(2);}
      else if(f==="rpvp"){d.pvp=isNaN(v)?0:v;d.margen=Math.round(revMargen(d.coste||0,d.pvp));const el=document.getElementById("rmargen-in");if(el&&document.activeElement!==el)el.value=nf(d.margen,0);}
      else{const l=d.receta[+inp.dataset.i];if(!l)return;if(f==="cant")l.cant=isNaN(v)?0:v;if(f==="precio")d.precios[l.prod]=isNaN(v)?0:v;if(f==="merma")d.mermas[l.prod]=isNaN(v)?0:Math.min(90,v);}
      pintarFicha();
    });
  });
  document.querySelectorAll("#screen [data-rm]").forEach(b=>b.addEventListener("click",()=>{ficha.draft.receta.splice(+b.dataset.rm,1);rerenderFicha();}));
  const sel=document.getElementById("add-prod"),unit=document.getElementById("add-unit");
  if(sel&&unit){const upd=()=>{unit.textContent=udReceta(CAT[sel.value].ud);};sel.addEventListener("change",upd);upd();}
  const addBtn=document.getElementById("add-line");
  if(addBtn)addBtn.addEventListener("click",()=>{const id=sel.value,cant=parseFloat(document.getElementById("add-cant").value)||0;const ud=udReceta(CAT[id].ud);ficha.draft.receta.push({prod:id,cant,ud});if(ficha.draft.precios[id]==null)ficha.draft.precios[id]=prod(id).precio;if(ficha.draft.mermas[id]==null)ficha.draft.mermas[id]=prod(id).merma||0;rerenderFicha();});
  const ac=document.getElementById("t-accept"),dc=document.getElementById("t-discard");
  if(ac)ac.addEventListener("click",aceptarFicha);
  if(dc)dc.addEventListener("click",()=>{openFicha(ficha.id);rerenderFicha();toast("Cambios descartados");});
}

/* ===== PROVEEDORES (funcional) ===== */
function consumoAnual(id){let t=0;STATE.platos.forEach(p=>p.receta.forEach(l=>{if(l.prod===id)t+=l.cant*FACTOR[l.ud]*p.ventas*12;}));return t/(1-(prod(id).merma||0)/100);}
function cartaConPrecio(prodId,nuevoPrecio){let coste=0,ing=0;const m=prod(prodId).merma||0;STATE.platos.forEach(p=>{ing+=p.pvp*p.ventas;p.receta.forEach(l=>{const pn=l.prod===prodId?(nuevoPrecio/(1-m/100)):precioNeto(l.prod);coste+=pn*l.cant*FACTOR[l.ud]*p.ventas;});});return {coste,ingresos:ing,fc:foodCost(coste,ing),margen:ing-coste};}
function provDeletable(k){return !Object.keys(CAT).some(id=>currentProv(id)===k)&&!allAlbaranes().some(a=>a.prov===k)&&!Object.keys(STATE.alternativas).some(pid=>(STATE.alternativas[pid]||[]).some(a=>a.prov===k));}

function screenProveedores(){

    const bestAlt=STATE.alternativas[id].filter(a=>a.precio<p.precio).sort((a,b)=>a.precio-b.precio)[0];
    return `<section class="panel"><div class="panel__head"><h2 class="panel__title">${esc(p.nombre)}</h2><button class="btn btn--sm" data-addalt="${esc(id)}" type="button">${icon("plus",13)}Alternativa</button></div><div class="panel__body"><div class="versus">${cards}</div>${bestAlt?`<div class="saving"><div><div class="eyebrow">Mejor alternativa</div><div class="saving__val">−${eur(p.precio-bestAlt.precio)}/${p.ud}</div></div><div><div class="eyebrow">Consumo estimado</div><div class="saving__val" style="color:var(--ink)">${nf(bruto,0)} ${p.ud}/año</div></div><div><div class="eyebrow">Ahorro si cambias</div><div class="saving__val">${eur((p.precio-bestAlt.precio)*bruto,0)}/año</div></div></div>`:`<p class="panel__note" style="margin-top:12px">Tu proveedor actual es el más barato de los comparados.</p>`}</div></section>`;
  }).join("");

  const provCards=Object.keys(STATE.proveedores).map(k=>{
    const prv=STATE.proveedores[k];
    const prods=Object.keys(CAT).filter(id=>currentProv(id)===k);
    const subidas=prods.filter(id=>CAT[id].hist&&CAT[id].hist[CAT[id].hist.length-1]>CAT[id].hist[0]).length;

    return `<div class="panel" style="padding:16px;display:flex;flex-direction:column;gap:12px">
      <div><div class="dish__name" style="font-size:15.5px">${esc(prv.nombre)}</div>${prv.empresa?`<div class="dish__fam">${esc(prv.empresa)}</div>`:""}<div class="dish__fam" style="margin-top:3px">${esc(prv.entrega||"Sin entrega fijada")}${prv.contacto?" · "+esc(prv.contacto):""}</div></div>

/* --- Cambiar de proveedor --- */
function openCambioProveedor(id,altprov){
  const alt=(STATE.alternativas[id]||[]).find(a=>a.prov===altprov); if(!alt)return;
  const p=prod(id),before=resumenCarta(),after=cartaConPrecio(id,alt.precio);
  const bruto=consumoAnual(id),ahorro=(p.precio-alt.precio)*bruto;
  const prvNew=STATE.proveedores[altprov],prvOld=STATE.proveedores[currentProv(id)]||{nombre:currentProv(id)};
  openOverlay(`<div class="modal"><div class="modal__head"><span class="modal__title">Cambiar de proveedor</span><button class="modal__x" data-close type="button">${icon("x",18)}</button></div><div class="modal__body">
    <p style="font-size:13.5px;color:var(--muted)"><b style="color:var(--ink)">${esc(p.nombre)}</b>: pasar de ${esc(prvOld.nombre)} a <b style="color:var(--ink)">${esc(prvNew.nombre)}</b>.</p>
    <div class="compare"><div class="compare__col"><div class="compare__lab">Precio ahora</div><div class="compare__val">${eur(p.precio)}</div></div><div class="compare__arrow">${icon("flecha",18)}</div><div class="compare__col"><div class="compare__lab">Nuevo precio</div><div class="compare__val" style="color:var(--ok)">${eur(alt.precio)}</div></div></div>
    <div class="compare" style="font-size:12px"><div class="compare__col"><div class="compare__lab">Food cost carta</div><div style="font-family:var(--f-num);margin-top:3px">${pct(before.fc)}</div></div><div class="compare__arrow">${icon("flecha",14)}</div><div class="compare__col"><div class="compare__lab">Food cost carta</div><div style="font-family:var(--f-num);margin-top:3px;color:${after.fc<=before.fc?"var(--ok)":"var(--crit)"}">${pct(after.fc)}</div></div></div>
    <div class="verdict verdict--${ahorro>=0?"ok":"crit"}">${ahorro>=0?`Ahorras <b>${eur(ahorro,0)}</b> al año con tu consumo actual (${nf(bruto,0)} ${p.ud}). El entrega es «${esc(prvNew.entrega||"")}».`:`Es <b>${eur(Math.abs(ahorro),0)}</b> más caro al año. Cámbialo solo si compensa por calidad o servicio.`}</div>
    <p class="panel__note">Al confirmar, ${esc(prvOld.nombre)} queda guardado como alternativa por si quieres volver.</p>
  </div><div class="modal__foot"><button class="btn" data-close type="button">Cancelar</button><button class="btn btn--primary" data-doswitch="${esc(id)}::${esc(altprov)}" type="button">Confirmar cambio</button></div></div>`,true);
}
function aplicarCambioProveedor(id,altprov){
  const alt=(STATE.alternativas[id]||[]).find(a=>a.prov===altprov); if(!alt)return;
  const oldProv=currentProv(id),oldPrice=prod(id).precio;
  STATE.productos[id]=Object.assign({},STATE.productos[id],{prov:altprov,precio:alt.precio});
  let alts=(STATE.alternativas[id]||[]).filter(a=>a.prov!==altprov);
  if(oldProv&&!alts.some(a=>a.prov===oldProv))alts.push({prov:oldProv,precio:oldPrice,nota:"Proveedor anterior"});
  STATE.alternativas[id]=alts;
  save(); closeOverlay(); ir("proveedores"); toast("Cambiado a "+(STATE.proveedores[altprov]?STATE.proveedores[altprov].nombre:altprov));
}

/* --- Añadir alternativa / comparativa --- */

  const prodOpts=Object.keys(CAT).map(k=>`<option value="${k}"${k===prefId?" selected":""}>${esc(CAT[k].nombre)}</option>`).join("");

  openOverlay(`<div class="modal"><div class="modal__head"><span class="modal__title">Añadir alternativa</span><button class="modal__x" data-close type="button">${icon("x",18)}</button></div><div class="modal__body">

    <div class="field"><label for="al-prov">Proveedor alternativo</label><select id="al-prov">${provOpts}</select></div>
    <div style="display:grid;grid-template-columns:1fr 1.4fr;gap:12px"><div class="field"><label for="al-precio">Precio / ud</label><input id="al-precio" type="number" min="0" step="0.05" value="0"></div><div class="field"><label for="al-nota">Nota</label><input id="al-nota" type="text" placeholder="p. ej. congelado, otro calibre"></div></div>

  </div><div class="modal__foot"><button class="btn" data-close type="button">Cancelar</button><button class="btn btn--primary" id="al-save" type="button">Guardar alternativa</button></div></div>`,true);
  document.getElementById("al-save").addEventListener("click",()=>{
    const id=document.getElementById("al-prod").value,pr=document.getElementById("al-prov").value,precio=parseFloat(document.getElementById("al-precio").value)||0,nota=document.getElementById("al-nota").value.trim();

}

/* ===== INVENTARIO (editable) ===== */
const pedidoSugerido = () => STATE.inventario.filter(it=>it.stock<it.minimo).map(it=>{const qty=Math.max(0,+(it.minimo*2-it.stock).toFixed(1));return {it,qty,importe:qty*prod(it.prod).precio};});
let invCat="Todas";
const invItemCat = it => it.cat || catOf(it.prod);
function filaInventario(it){
  const p=prod(it.prod),st=estadoStock(it),ancho=Math.max(4,Math.min(100,(st.dias/21)*100));return `<tr>
    <td><div class="dish__name">${esc(p.nombre)}</div><div class="dish__fam">${esc(p.prov?STATE.proveedores[p.prov].nombre:"Elaboración propia")}</div></td>
    <td class="num"><div class="uds-cell"><input class="uds-input" style="width:62px" type="number" min="0" step="0.5" value="${it.stock}" data-inv="stock" data-prod="${esc(it.prod)}" aria-label="Stock de ${esc(p.nombre)}"><span style="font-size:11px;color:var(--faint)">${p.ud}</span></div></td>
    <td class="num"><div class="uds-cell"><input class="uds-input" style="width:56px" type="number" min="0" step="0.5" value="${it.consumo}" data-inv="consumo" data-prod="${esc(it.prod)}" aria-label="Consumo de ${esc(p.nombre)}"><span style="font-size:11px;color:var(--faint)">/sem</span></div></td>
    <td><div class="cover"><div class="cover__track"><div class="cover__fill" data-cov="${esc(it.prod)}" style="width:${ancho.toFixed(0)}%;background:${st.color}"></div></div><span class="cover__min" data-covd="${esc(it.prod)}">${nf(st.dias,1)} d</span></div></td>
    <td class="num"><div class="uds-cell"><input class="uds-input" style="width:52px" type="number" min="0" step="0.5" value="${it.minimo}" data-inv="minimo" data-prod="${esc(it.prod)}" aria-label="Mínimo de ${esc(p.nombre)}"><span style="font-size:11px;color:var(--faint)">${p.ud}</span></div></td>
    <td><span class="pill ${st.cls}" data-estado="${esc(it.prod)}">${st.label}</span></td>
    <td class="num" data-pedir="${esc(it.prod)}">${it.stock<it.minimo?eur((it.minimo*2-it.stock)*p.precio,0):"—"}</td>
    <td><button class="rmline" data-invrm="${esc(it.prod)}" type="button" aria-label="Quitar ${esc(p.nombre)}">${icon("x",15)}</button></td>
  </tr>`;
}
function screenInventario(){
  const conteo={}; STATE.inventario.forEach(it=>{const c=invItemCat(it);conteo[c]=(conteo[c]||0)+1;});
  const catsPresentes=Object.keys(conteo).sort((a,b)=>catRank(a)-catRank(b));
  if(invCat!=="Todas"&&!conteo[invCat])invCat="Todas";
  const orden=(arr)=>arr.slice().sort((a,b)=>coberturaDias(a)-coberturaDias(b));
  const chips=[`<button class="catchip${invCat==="Todas"?" catchip--on":""}" data-invcat="Todas" type="button">Todas<span class="catchip__n">${STATE.inventario.length}</span></button>`]
    .concat(catsPresentes.map(c=>`<button class="catchip${invCat===c?" catchip--on":""}" data-invcat="${esc(c)}" type="button">${esc(c)}<span class="catchip__n">${conteo[c]}</span></button>`)).join("");
  let filas;
  if(invCat==="Todas"){
    filas=catsPresentes.map(c=>{
      const items=orden(STATE.inventario.filter(it=>invItemCat(it)===c));

      const sub=`<tr class="cat-sub"><td colspan="8"><span class="cat-sub__name">${esc(c)}</span><span class="cat-sub__grp">${esc(grupoDeCat(c))}</span><span class="cat-sub__n">${items.length} ref. · ${nf(valor,0)} €</span></td></tr>`;
      return sub+items.map(filaInventario).join("");
    }).join("");
  } else {
    const items=orden(STATE.inventario.filter(it=>invItemCat(it)===invCat));
    filas=items.length?items.map(filaInventario).join(""):`<tr><td colspan="8"><p class="empty" style="padding:14px 0">No hay referencias en «${esc(invCat)}».</p></td></tr>`;
  }
  const nPedir=pedidoSugerido().length;
  return `<section class="kpis">
    <div class="kpi"><div class="kpi__label">Referencias bajo mínimo</div><div class="kpi__val" id="inv-bajo">—</div><div class="kpi__foot">de ${STATE.inventario.length} en el almacén</div></div>

    <div class="kpi"><div class="kpi__label">Cobertura media</div><div class="kpi__val" id="inv-cob">—</div><div class="kpi__foot">Al ritmo actual</div></div>
  </section>
  <section class="panel"><div class="panel__head"><h2 class="panel__title">Almacén por categorías</h2><span class="panel__note">Filtra por categoría · edita stock, consumo o mínimo · la barra llega a 21 días</span></div>

    <div class="table__scroll"><table class="table"><thead><tr><th>Producto</th><th class="num">Stock</th><th class="num">Consumo</th><th>Cobertura</th><th class="num">Mínimo</th><th>Estado</th><th class="num">A pedir</th><th></th></tr></thead><tbody>${filas}</tbody></table></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:15px">
      <button class="btn btn--primary" id="inv-orderbtn" data-pedido type="button"${nPedir?"":" disabled"}>Preparar pedido${nPedir?" ("+nPedir+")":""}${icon("flecha",14)}</button>
      <button class="btn" data-invadd type="button">${icon("plus",14)}Añadir referencia</button>
      <button class="btn btn--ghost" data-action="factura" type="button">${icon("upload",14)}Registrar factura</button>
    </div></div></section>`;
}

function wireRentabilidad(){

function wireReventa(){
  document.querySelectorAll('[data-rev]').forEach(inp=>inp.addEventListener("input",()=>{
    const id=inp.dataset.id,f=inp.dataset.rev,v=parseFloat(inp.value),p=STATE.platos.find(x=>x.id===id);if(!p)return;

/* --- Factura: adjuntar → detectar → revisar (base+IVA) → validar --- */
let facLineas=[], facAdjunto=null, facDetectado=false, facProv="mediterranea";
function nuevaLinea(id){ return {prod:id,cant:1,precio:prod(id).precio,iva:ivaOf(id)}; }
function openFactura(){
  facProv="mediterranea"; facAdjunto=null; facDetectado=false;
  facLineas=[nuevaLinea("lubina")]; facLineas[0].cant=10;
  openOverlay(facturaHTML()); wireFactura();
}
function facturaTotales(lineas){ let base=0; const porIva={}; lineas.forEach(l=>{const b=(l.cant||0)*(l.precio||0); base+=b; const r=l.iva!=null?l.iva:10; porIva[r]=(porIva[r]||0)+b;}); let iva=0; Object.keys(porIva).forEach(r=>iva+=porIva[r]*(+r)/100); return {base,iva,total:base+iva,porIva}; }
function detectarFactura(){
  const prov=document.getElementById("fac-prov").value; facProv=prov;
  let cand=Object.keys(CAT).filter(id=>CAT[id].prov===prov);
  if(!cand.length)cand=["lubina","aove","patata"];
  cand=cand.slice(0,5);
  facLineas=cand.map(id=>{const base=prod(id).precio; const precio=+(base*(1+(Math.random()*0.09-0.02))).toFixed(2); return {prod:id,cant:Math.max(1,Math.round(2+Math.random()*10)),precio,iva:ivaOf(id)};});
  facDetectado=true; rerenderFactura(); toast("Productos detectados · revisa antes de validar");
}

  let capturaHtml;

    capturaHtml=`<div class="drop" id="fac-drop">${icon("camara",22)}<span class="drop__t">Sube el albarán: foto o PDF</span><span class="drop__d">En el móvil se abre la cámara · lo leemos y rellenamos las líneas</span></div>`;

  const t=facturaTotales(facLineas);
  const ivaRows=Object.keys(t.porIva).sort((a,b)=>a-b).map(r=>`<div class="ivasum__row"><span>IVA ${r}% · base ${eur(t.porIva[r])}</span><span class="ivasum__v">${eur(t.porIva[r]*(+r)/100)}</span></div>`).join("");
  return `<div class="modal"><div class="modal__head"><span class="modal__title">Nueva factura</span><button class="modal__x" data-close type="button">${icon("x",18)}</button></div>

    ${capturaHtml}

function wireFactura(){
  const drop=document.getElementById("fac-drop");
  if(drop)drop.addEventListener("click",()=>pickFile((data,f)=>{facAdjunto={name:f.name,data,pdf:isPdf(f.name,f.type)};facDetectado=false;rerenderFactura();},".pdf,image/*",true));
  const det=document.getElementById("fac-detect"); if(det)det.addEventListener("click",detectarFactura);
  const provSel=document.getElementById("fac-prov"); if(provSel)provSel.addEventListener("change",()=>{facProv=provSel.value;});
  document.querySelectorAll("[data-flrm]").forEach(b=>b.addEventListener("click",()=>{facLineas.splice(+b.dataset.flrm,1);if(!facLineas.length)facLineas.push(nuevaLinea("aove"));rerenderFactura();}));
  document.querySelectorAll("[data-fl]").forEach(el=>el.addEventListener("change",()=>{const i=+el.dataset.i,f=el.dataset.fl;if(f==="prod"){facLineas[i].prod=el.value;facLineas[i].precio=prod(el.value).precio;facLineas[i].iva=ivaOf(el.value);rerenderFactura();}else if(f==="cant"){facLineas[i].cant=parseFloat(el.value)||0;rerenderFactura();}else if(f==="iva"){facLineas[i].iva=parseFloat(el.value);rerenderFactura();}else{facLineas[i].precio=parseFloat(el.value)||0;rerenderFactura();}}));
  const add=document.getElementById("fac-add"); if(add)add.addEventListener("click",()=>{facLineas.push(nuevaLinea("aove"));rerenderFactura();});
  const save=document.getElementById("fac-save"); if(save)save.addEventListener("click",guardarFactura);
}
function guardarFactura(){
  const prov=document.getElementById("fac-prov").value;
  const fecha=document.getElementById("fac-fecha").value.trim()||"hoy";
  const ref=document.getElementById("fac-ref").value.trim()||("ALB-"+String(Date.now()).slice(-4));
  const rec=facLineas.filter(l=>l.cant>0).map(l=>{const ant=prod(l.prod).precio;STATE.productos[l.prod]=Object.assign({},STATE.productos[l.prod],{precio:l.precio});return {prod:l.prod,cant:l.cant,precio:l.precio,ant};});
  if(!rec.length){toast("Añade al menos una línea");return;}
  // La compra repone el inventario de los productos que sigues.
  const repuestos=[];
  rec.forEach(l=>{const it=STATE.inventario.find(i=>i.prod===l.prod);if(it){it.stock=+(it.stock+l.cant).toFixed(1);repuestos.push(l.prod);}});
  STATE.albaranes.unshift({ref,fecha,prov,lineas:rec,user:true,adjunto:facAdjunto});
  save();
  const cambios=rec.filter(l=>Math.abs(l.precio-l.ant)>0.001);
  openOverlay(resumenFacturaHTML(prov,cambios,repuestos),true);
}
function resumenFacturaHTML(prov,cambios,repuestos){
  const alertas=alertasPrecio();
  const rows=cambios.length?cambios.map(c=>{const p=prod(c.prod);const afect=STATE.platos.filter(pl=>pl.receta.some(l=>l.prod===c.prod));return `<div class="feed__row"><span class="swatch" style="background:${c.precio>c.ant?"var(--crit)":"var(--ok)"}"></span><div><div class="feed__what">${esc(p.nombre)}</div><div class="feed__meta">${eur(c.ant)} → ${eur(c.precio)}/${p.ud} · ${afect.length} plato${afect.length===1?"":"s"}</div></div>${deltaTag(c.precio,c.ant)}</div>`;}).join(""):'<p class="empty">Sin cambios de precio respecto a lo que ya tenías.</p>';
  const repNote=(repuestos&&repuestos.length)?`<div class="verdict verdict--ok">Repuesto en inventario: ${esc(repuestos.map(r=>prod(r).nombre).join(", "))}.</div>`:"";
  const top=alertas[0];
  return `<div class="modal"><div class="modal__head"><span class="modal__title">Factura guardada</span><button class="modal__x" data-close type="button">${icon("x",18)}</button></div><div class="modal__body">
    <p style="font-size:13.5px;color:var(--muted)">Guardada en ${esc(STATE.proveedores[prov].nombre)}. Esto ha cambiado de precio:</p>
    <div class="feed">${rows}</div>
    ${repNote}
    ${top?`<div class="verdict verdict--${top.sim.salenDeObjetivo.length?"crit":"warn"}">El aviso principal ahora es <b>${esc(prod(top.prod).nombre)}</b> (+${nf(top.pct,0)} %): ${eur(top.sim.impacto,0)} extra al mes. ${top.sim.salenDeObjetivo.length?esc(top.sim.salenDeObjetivo.map(x=>x.nombre).join(" y "))+" se sale del objetivo — conviene revisar su receta o su PVP.":"Ningún plato se sale del objetivo."}</div>`:""}
  </div><div class="modal__foot"><button class="btn" data-close type="button">Cerrar</button>${top?`<button class="btn btn--primary" data-dish="${top.sim.platos[0].id}" type="button">Valorar ${esc(top.sim.platos[0].nombre)}</button>`:`<button class="btn btn--primary" data-go="compras" type="button">Ver compras</button>`}</div></div>`;
}

    <div class="field"><label for="np-nombre">Nombre</label><input id="np-nombre" type="text" placeholder="p. ej. Pulpo a la brasa · Ribera del Duero (copa)"></div>

      <div class="field"><label for="np-tipo">Tipo</label><select id="np-tipo"><option value="elaborado">Elaborado (con escandallo)</option><option value="reventa">Reventa (bebida / producto)</option></select></div>

    </div>

    <div id="np-rev" hidden><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="field"><label for="np-coste">Precio de compra (€)</label><input id="np-coste" type="number" min="0" step="0.05" value="1.00"></div><div class="field"><label for="np-margen">Margen deseado (%)</label><input id="np-margen" type="number" min="0" max="99" step="1" value="75"></div></div><p class="panel__note">El PVP se calcula con el margen. Podrás ajustarlo en su ficha.</p></div>
  </div><div class="modal__foot"><button class="btn" data-close type="button">Cancelar</button><button class="btn btn--primary" id="np-save" type="button">Crear</button></div></div>`);
  const tipo=document.getElementById("np-tipo");
  const sync=()=>{const rev=tipo.value==="reventa";document.getElementById("np-rev").hidden=!rev;document.getElementById("np-elab").hidden=rev;if(rev){document.getElementById("np-grupo").value="Vinos";}};
  tipo.addEventListener("change",sync);

    const nombre=document.getElementById("np-nombre").value.trim()||"Producto nuevo";

    if(tipo.value==="reventa"){
      const coste=parseFloat(document.getElementById("np-coste").value)||0,margen=parseFloat(document.getElementById("np-margen").value)||0;
      STATE.platos.push({id,nombre,familia,tipo:"reventa",coste,margen,pvp:+revPvp(coste,margen).toFixed(2),ventas:0,foto:null,receta:[]});
      save(); closeOverlay(); ir("ficha",id); toast("Producto de reventa creado");
    } else {
      const pvp=parseFloat(document.getElementById("np-pvp").value)||0;
      STATE.platos.push({id,nombre,familia,tipo:"elaborado",pvp,ventas:0,foto:null,receta:[]});
      save(); closeOverlay(); ir("ficha",id); toast("Plato creado · añade sus ingredientes");
    }
  });
}

    <div style="text-align:center;margin-top:26px;font-size:11px;color:#8a7f66;letter-spacing:.14em;text-transform:uppercase">Carta generada con RESTORA</div>
  </div>`;
  openOverlay(`<div class="modal"><div class="modal__head"><span class="modal__title">Carta imprimible</span><button class="modal__x" data-close type="button">${icon("x",18)}</button></div><div class="modal__body"><div style="border:1px solid var(--line);border-radius:12px;overflow:hidden"><div style="max-width:100%;padding:26px 22px;background:#fbf7ee;color:#1a1a17"><div style="text-align:center;margin-bottom:20px"><div style="font-family:var(--f-display);font-size:30px">Casa Pujol</div><div style="font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:#8a7f66;margin-top:3px">Tarragona · Cocina de mercado</div></div>${fams.map(fam=>`<div style="margin-bottom:16px"><div style="font-family:var(--f-display);font-size:19px;border-bottom:1px solid #d8c9a6;padding-bottom:4px;margin-bottom:9px">${esc(fam)}</div>${STATE.platos.filter(p=>p.familia===fam).map(p=>`<div style="display:flex;justify-content:space-between;gap:14px;margin-bottom:7px;font-size:13px"><span style="font-weight:500">${esc(p.nombre)}</span><span style="font-family:var(--f-num)">${eur(p.pvp)}</span></div>`).join("")}</div>`).join("")}</div></div><p class="panel__note" style="margin-top:12px">Carta personalizada de Casa Pujol, lista para imprimir o guardar en PDF. Sin costes ni food cost: sólo lo que ve el cliente.</p></div><div class="modal__foot"><button class="btn" data-close type="button">Cerrar</button><button class="btn btn--primary" id="do-print" type="button">${icon("print",14)}Imprimir</button></div></div>`);
  document.getElementById("do-print").addEventListener("click",()=>window.print());
}

/* ===== navegación ===== */
const PANTALLAS={
  hoy:{titulo:"Hoy",sub:"Situación general de Casa Pujol",render:screenHoy},
  carta:{titulo:"Carta",sub:"Tu carta, con la rentabilidad de cada plato",render:screenCarta},
  escandallos:{titulo:"Escandallos",sub:"El coste real de cada plato, ingrediente a ingrediente",render:screenEscandallos},
  compras:{titulo:"Compras",sub:"Facturas del mes y evolución de cada precio",render:screenCompras},
  proveedores:{titulo:"Proveedores",sub:"El mismo producto, comparado entre quienes te lo sirven",render:screenProveedores},
  inventario:{titulo:"Inventario",sub:"Stock, consumo y días de cobertura",render:screenInventario},
  rentabilidad:{titulo:"Rentabilidad",sub:"Registra las ventas y mira qué plato te sostiene",render:screenRentabilidad},
  inteligencia:{titulo:"Inteligencia",sub:"Avisos calculados a partir de tus compras",render:screenInteligencia},
};
const RAIL=["hoy","carta","escandallos","compras","proveedores","inventario","rentabilidad","inteligencia"];
const LABELS={hoy:"Hoy",carta:"Carta",escandallos:"Escandallos",compras:"Compras",proveedores:"Proveedores",inventario:"Inventario",rentabilidad:"Rentabilidad",inteligencia:"Inteligencia"};
const TABS=["hoy","carta","compras","rentabilidad","mas"];
const MAS_GROUP=["escandallos","proveedores","inventario","inteligencia"];

function pintarNavAll(activo){
  const fuera=fueraDeObjetivo().length,bajos=stockBajo().length,alertas=alertasPrecio().length;
  document.getElementById("nav").innerHTML=RAIL.map(id=>{let b="";if(id==="inventario"&&bajos)b=`<span class="navitem__count">${bajos}</span>`;if(id==="escandallos"&&fuera)b=`<span class="navitem__count">${fuera}</span>`;if(id==="inteligencia"&&alertas)b=`<span class="navitem__count">${alertas}</span>`;return `<button class="navitem" type="button" data-go="${id}"${id===activo?' aria-current="page"':""}>${icon(id,17)}<span>${LABELS[id]}</span>${b}</button>`;}).join("");
  const masActive=MAS_GROUP.indexOf(activo)>=0||activo==="ficha";
  const masBadge=fuera+bajos;
  document.getElementById("tabbar").innerHTML=TABS.map(id=>{
    if(id==="mas")return `<button class="tab" type="button" data-mas${masActive?' aria-current="page"':""}>${icon("mas",22)}<span>Más</span>${masBadge?`<span class="tab__badge">${masBadge}</span>`:""}</button>`;
    return `<button class="tab" type="button" data-go="${id}"${id===activo?' aria-current="page"':""}>${icon(id,22)}<span>${LABELS[id]}</span></button>`;
  }).join("");
}
function openMasSheet(){
  openOverlay(`<div class="modal"><div class="modal__head"><span class="modal__title">Más</span><button class="modal__x" data-close type="button">${icon("x",18)}</button></div><div class="modal__body"><div class="sheet-actions">
    ${MAS_GROUP.map(id=>`<button class="sheet-action" data-go="${id}" type="button"><span class="sheet-action__ic">${icon(id,20)}</span><span><span class="sheet-action__t">${LABELS[id]}</span><span class="sheet-action__d">${PANTALLAS[id].sub}</span></span></button>`).join("")}
    <button class="sheet-action" data-themetoggle type="button"><span class="sheet-action__ic">${icon("hoy",20)}</span><span><span class="sheet-action__t">Cambiar tema</span><span class="sheet-action__d">Claro u oscuro</span></span></button>
    <button class="sheet-action" data-doreset type="button"><span class="sheet-action__ic">${icon("atras",20)}</span><span><span class="sheet-action__t">Restaurar datos</span><span class="sheet-action__d">Vuelve a los datos de ejemplo</span></span></button>
  </div></div></div>`);
}

let vista="hoy";
function ir(id,dishId){
  const screen=document.getElementById("screen");
  if(id==="ficha"&&dishId){
    openFicha(dishId);
    document.getElementById("scr-title").textContent=ficha.nombre;
    document.getElementById("scr-sub").textContent=(ficha.tipo==="reventa"?"Ficha de producto · ":"Ficha de escandallo · ")+ficha.familia;
    screen.innerHTML=fichaHTML(); wireFicha(); pintarFicha();
    pintarNavAll(ficha.tipo==="reventa"?"carta":"escandallos"); vista="ficha";
  } else {
    const s=PANTALLAS[id]||PANTALLAS.hoy; const key=PANTALLAS[id]?id:"hoy";
    document.getElementById("scr-title").textContent=s.titulo;
    document.getElementById("scr-sub").textContent=s.sub;
    screen.innerHTML=s.render();
    pintarNavAll(key); vista=key;
    if(key==="rentabilidad")wireRentabilidad();
    if(key==="inventario")wireInventario();
  }
  window.scrollTo({top:0,behavior:"auto"});
}

/* ===== eventos ===== */
function doAction(a){
  if(a==="factura")openFactura();
  else if(a==="plato")openNuevoPlato();
  else if(a==="carta")openSubirCarta();
  else if(a==="imprimir")abrirImprimible();
}
document.addEventListener("click",e=>{
  if(e.target.closest("[data-close]")){closeOverlay();return;}
  const act=e.target.closest("[data-action]"); if(act){doAction(act.dataset.action);return;}
  const photo=e.target.closest("[data-photo]");
  if(photo){const id=photo.dataset.photo;pickFile((data)=>{const p=STATE.platos.find(x=>x.id===id);if(p){p.foto=data;save();if(vista==="ficha"&&ficha&&ficha.id===id){ficha.foto=data;rerenderFicha();}else ir(vista);toast("Foto actualizada");}},"image/*",true);return;}
  if(e.target.closest("[data-mas]")){openMasSheet();return;}
  const icat=e.target.closest("[data-invcat]"); if(icat){invCat=icat.dataset.invcat;ir("inventario");return;}
  const invrm=e.target.closest("[data-invrm]"); if(invrm){const id=invrm.dataset.invrm;STATE.inventario=STATE.inventario.filter(i=>i.prod!==id);save();ir("inventario");toast("Referencia quitada");return;}
  if(e.target.closest("[data-invadd]")){openAddItem();return;}
  if(e.target.closest("[data-pedido]")){openPedido();return;}
  if(e.target.closest("[data-recibir]")){recibirPedido();return;}
  if(e.target.closest("[data-pedidofactura]")){pedidoAFactura();return;}
  const invdel=e.target.closest("[data-albrm]"); if(invdel){const ref=invdel.dataset.albrm;STATE.albaranes=STATE.albaranes.filter(a=>a.ref!==ref);save();ir("compras");toast("Factura eliminada");return;}
  const sw=e.target.closest("[data-switch]"); if(sw){const[id,pr]=sw.dataset.switch.split("::");openCambioProveedor(id,pr);return;}
  const dsw=e.target.closest("[data-doswitch]"); if(dsw){const[id,pr]=dsw.dataset.doswitch.split("::");aplicarCambioProveedor(id,pr);return;}
  const aa=e.target.closest("[data-addalt]"); if(aa){openAddAlt(aa.dataset.addalt||undefined);return;}
  if(e.target.closest("[data-addprov]")){openProvForm();return;}
  const ep=e.target.closest("[data-editprov]"); if(ep){openProvForm(ep.dataset.editprov);return;}
  const dp=e.target.closest("[data-delprov]"); if(dp){borrarProv(dp.dataset.delprov);return;}
  const pd=e.target.closest("[data-provdet]"); if(pd){openProvDetail(pd.dataset.provdet);return;}
  if(e.target.closest("[data-themetoggle]")){closeOverlay();toggleTheme();return;}
  if(e.target.closest("[data-doreset]")){closeOverlay();STATE=makeDefaultState();save();ir("hoy");toast("Datos restaurados");return;}
  const go=e.target.closest("[data-go]"); if(go){closeOverlay();ir(go.dataset.go);return;}
  if(e.target.closest("input,textarea,select,label,.lineb,.linebuilder"))return;
  const dish=e.target.closest("[data-dish]"); if(dish){closeOverlay();ir("ficha",dish.dataset.dish);}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeOverlay();return;}
  if(e.key!=="Enter"&&e.key!==" ")return;
  const row=e.target.closest('tr[data-dish]'); if(row){e.preventDefault();ir("ficha",row.dataset.dish);}
});
document.getElementById("overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeOverlay();});

function toggleTheme(){
  const root=document.documentElement;
  const dark=root.dataset.theme==="dark"||(!root.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);
  root.dataset.theme=dark?"light":"dark";
  ir(vista==="ficha"?"hoy":vista);
}
document.getElementById("theme").addEventListener("click",toggleTheme);
document.getElementById("reset").addEventListener("click",()=>{STATE=makeDefaultState();save();ir("hoy");toast("Datos restaurados");});
document.getElementById("add").addEventListener("click",openAddSheet);

(async function(){
  mountSyncUI();
  const res = await bootFromServer();
  if(res === "redirect") return;
  ir("hoy");
  if(res === "offline") setSyncBadge("offline");
})();
