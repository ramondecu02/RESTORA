# Cloudflare Pages config for the RESTORA landing (static export + Functions).
# Deploy:  npm run build:cf  &&  npx wrangler pages deploy
name = "restora-web"
compatibility_date = "2026-09-14"
pages_build_output_dir = "out"

# D1 database binding used by functions/api/leads.js (env.DB)
[[d1_databases]]
binding = "DB"
database_name = "restora-leads"
database_id = "c957c4ed-9ef4-4b8c-9fde-16b56b9319fd"

# Non-secret variables (optional). Set the sender once you verify a domain
# in Resend; otherwise the function falls back to onboarding@resend.dev.
[vars]
# LEAD_NOTIFY_FROM = "RESTORA <hola@restoraapp.com>"

# Secrets — DO NOT put here. Set them with:
#   npx wrangler pages secret put RESEND_API_KEY
#   npx wrangler pages secret put LEAD_NOTIFY_TO
